name: RaceDay Build and Test - Part 3

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore RaceDay.API.sln

    - name: Build all projects
      run: dotnet build RaceDay.API.sln --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test RaceDay.API.sln --configuration Release --no-build --verbosity normal